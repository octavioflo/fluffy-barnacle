plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stakely'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Byte Buddy agent used by Mockito inline; add explicit runtime dependency so we can attach it as a -javaagent
    testRuntimeOnly 'net.bytebuddy:byte-buddy-agent:1.18.5'
}

tasks.named('test') {
    useJUnitPlatform()

    // Attach the Byte Buddy agent jar as a javaagent at test JVM start to avoid dynamic agent loading warnings
    doFirst {
        def agent = configurations.testRuntimeClasspath.find { it.name.contains('byte-buddy-agent') }
        if (agent != null) {
            jvmArgs = (jvmArgs ?: []) + "-javaagent:${agent.absolutePath}"
        }
    }

    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        html.required.set(true)
    }
}